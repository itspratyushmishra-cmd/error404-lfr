<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error 404 — Camera Replay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .replay-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090c10;
      border-radius: 4px;
      overflow: hidden;
    }
    .replay-frame-box {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      background: #090c10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #replayImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="group">
      <div class="nav">
        <a href="/" class="nav-link">Monitor</a>
        <a href="/config" class="nav-link">Config</a>
        <a href="/camera" class="nav-link">Camera</a>
        <a href="/replay" class="nav-link active">Replay</a>
        <a href="/phone" class="nav-link">Phone</a>
      </div>
      <span id="dot" class="dot"></span>
      <span id="connText">Connecting...</span>
      <span id="statusPill" class="pill">IDLE</span>
      <span id="syncPill" class="pill">SYNC: WAIT</span>
    </div>
    <div class="group">
      <span class="pill info">POS: <span id="posVal">-</span></span>
      <span class="pill">ENC: <span id="encVal">- / -</span></span>
      <span class="pill">PWM: <span id="pwmVal">- / -</span></span>
      <span class="pill" id="camCountPill">FRAMES: 0</span>
    </div>
  </div>

  <div class="card" style="padding:8px;position:relative;overflow:hidden;">
    <div class="replay-stage">
      <div class="replay-frame-box">
        <img id="replayImg" alt="Recorded Frame">
        <div id="noFrameMsg" style="color:var(--muted);font-size:0.9rem;">No recorded camera frame at this timestamp.</div>
      </div>
    </div>
    <div id="hudOverlay" class="map-hud" style="left:14px;bottom:14px;font-size:0.75rem;">
      State: IDLE | Pos: - | Err: - | US: - | IR: - / -
    </div>
  </div>

  <div class="replaybar">
    <button id="btnPlay" class="btn" title="Play / Pause Replay">▶ Play</button>
    <button id="btnSpeed" class="btn" title="Playback Speed">1x</button>
    <button id="btnJumpSync" class="btn sync-btn" disabled title="Jump to [SYNC] LED_ON">⚡ Sync</button>
    <div class="scrub-wrap">
      <input id="scrubber" type="range" min="0" max="0" value="0" disabled>
      <div id="syncTick" class="sync-tick"></div>
    </div>
    <div class="time-info" id="timeInfo">00:00.0 / 00:00.0 (0)</div>
    <button id="btnLive" class="btn live-on">● LIVE</button>
    <span class="bar-sep"></span>
    <label class="sync-opt" title="Start all 3 MP4 exports at [SYNC] LED_ON timestamp">
      <input id="chkFromSync" type="checkbox" checked> Sync
    </label>
    <button id="btnExport" class="btn export-btn" disabled title="Export 3 MP4s + Config + Session Data">⬇ 3× MP4</button>
    <button id="btnResetRec" class="btn danger" title="Clear all stored telemetry & camera frames on server">Clear</button>
  </div>

  <script src="{{ url_for('static', filename='cam_replay.js') }}"></script>
</body>
</html>
